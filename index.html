<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 凱翔的錢包儀表板</title>
    <style>
        :root {
            --cube-color: #0087dc; --richart-color: #e11d48;
            --jiho-color: #4b5563; --linebank-color: #00c300;
            --esun-color: #009999;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px 10px; color: #334155; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .tag { background: #cbd5e1; font-size: 0.7rem; padding: 2px 10px; border-radius: 10px; color: #475569; font-weight: bold; }

        /* --- 卡片展示區 (修正無法顯示圖片的問題) --- */
        .card-gallery { display: flex; overflow-x: auto; gap: 12px; padding: 10px 0 20px 0; -webkit-overflow-scrolling: touch; }
        
        .card-preview { flex: 0 0 140px; background: white; border-radius: 15px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; position: relative; cursor: pointer; }
        
        /* 卡片照片容器：如果沒圖片，會顯示 CSS 背景色與文字 */
        .card-img-container {
            width: 100%; height: 80px;
            border-radius: 10px; margin-bottom: 8px;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 1.1rem;
            position: relative;
            border: 1px solid #eee;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* 實際顯示的圖片 (設為 0.1s 漸變，更流暢) */
        .card-img-container img {
            width: 100%; height: 100%;
            object-fit: contain; background: transparent;
            transition: opacity 0.1s;
        }

        /* 預設的 CSS 卡片背景色 (確保看不到圖片時仍有卡片感) */
        .bg-cube { background-color: var(--cube-color); }
        .bg-richart { background-color: var(--richart-color); }
        .bg-jiho { background-color: var(--jiho-color); }
        .bg-linebank { background-color: var(--linebank-color); }
        .bg-pi { background-color: var(--esun-color); }

        .card-preview .title { font-weight: 800; font-size: 0.8rem; display: block; margin-bottom: 2px; }
        .card-preview .memo { font-size: 0.65rem; color: #94a3b8; display: block; line-height: 1.2; min-height: 30px; }
        .up-hint { font-size: 0.5rem; color: #aaa; position: absolute; top: 5px; right: 8px; }

        /* 計算主體 */
        .main-box { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 16px; box-sizing: border-box; background: #fff; }
        
        .plan-select { padding: 12px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid #ccc; background: #f8fafc; font-size: 0.85rem; }
        .cube-border { border-left-color: var(--cube-color); }
        .ts-border { border-left-color: var(--richart-color); }

        button { width: 100%; padding: 16px; background: #0f172a; color: white; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: active 0.1s; }
        button:active { background: #334155; transform: scale(0.98); }

        /* 結果顯示 */
        .result-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 1px solid #f1f5f9; border-radius: 18px; margin-bottom: 10px; background: white; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-item.best { border: 2.5px solid #10b981; background: #f0fdf4; box-shadow: 0 4px 12px rgba(16,185,129,0.08); }
        .card-info h3 { margin: 0; font-size: 0.95rem; }
        .card-info p { margin: 2px 0 0; font-size: 0.7rem; color: #64748b; font-weight: 500; }
        .val { font-size: 1.4rem; font-weight: 800; text-align: right; color: #1e293b; }
        .best .val { color: #059669; }
        .badge { font-size: 0.6rem; padding: 2px 6px; border-radius: 5px; color: white; font-weight: bold; margin-bottom: 4px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="font-size:1.3rem;">2026/05 錢包權益儀表板</h1>
        <span class="tag">更新日期：2026年5月2日 (勞動節)</span>
    </div>

    <div class="card-gallery">
        <div class="card-preview" onclick="document.getElementById('up-cube').click()">
            <div class="card-img-container bg-cube">
                <span>CUBE</span> <img src="" id="img-cube" style="opacity:0;" onerror="this.style.opacity=0;">
            </div>
            <input type="file" id="up-cube" hidden onchange="pv(this, 'img-cube')">
            <span class="title" style="color:var(--cube-color)">國泰 CUBE</span>
            <span class="memo">全支付 7%<br>方案 3%</span>
        </div>
        
        <div class="card-preview" onclick="document.getElementById('up-richart').click()">
            <div class="card-img-container bg-richart">
                <span>Richart</span>
                <img src="" id="img-richart" style="opacity:0;" onerror="this.style.opacity=0;">
            </div>
            <input type="file" id="up-richart" hidden onchange="pv(this, 'img-richart')">
            <span class="title" style="color:var(--richart-color)">台新 Richart</span>
            <span class="memo">台新Pay 3.8%<br>加油 3.3%</span>
        </div>
        
        <div class="card-preview" onclick="document.getElementById('up-jiho').click()">
            <div class="card-img-container bg-jiho">
                <span>吉鶴</span>
                <img src="" id="img-jiho" style="opacity:0;" onerror="this.style.opacity=0;">
            </div>
            <input type="file" id="up-jiho" hidden onchange="pv(this, 'img-jiho')">
            <span class="title" style="color:var(--jiho-color)">聯邦吉鶴</span>
            <span class="memo">日本 AP 4%<br>國內保底 1%</span>
        </div>
        
        <div class="card-preview" onclick="document.getElementById('up-lb').click()">
            <div class="card-img-container bg-linebank">
                <span>LINEBank</span>
                <img src="" id="img-lb" style="opacity:0;" onerror="this.style.opacity=0;">
            </div>
            <input type="file" id="up-lb" hidden onchange="pv(this, 'img-lb')">
            <span class="title" style="color:var(--linebank-color)">LINE Bank</span>
            <span class="memo">午餐 15%<br>週末 4%</span>
        </div>
        
        <div class="card-preview" onclick="document.getElementById('up-pi').click()">
            <div class="card-img-container bg-pi">
                <span>Pi 簽帳</span>
                <img src="" id="img-pi" style="opacity:0;" onerror="this.style.opacity=0;">
            </div>
            <input type="file" id="up-pi" hidden onchange="pv(this, 'img-pi')">
            <span class="title" style="color:var(--esun-color)">玉山 Pi 簽帳</span>
            <span class="memo">Pi 錢包 3%<br>eWallet 1.2%</span>
        </div>
    </div>

    <div class="main-box">
        <div class="form-group">
            <label>💰 消費金額 (TWD)</label>
            <input type="number" id="amt" value="1000" inputmode="numeric">
        </div>

        <div class="form-group">
            <label>📍 支付工具 & 場景 (V+M+J 全能版)</label>
            <select id="payTool">
                <option value="PXPay">📲 全支付 (綁定國泰方案 7%)</option>
                <option value="LP_WE">📲 LINE Pay (週五~週日 4%)</option>
                <option value="LP_WD">📲 LINE Pay (平日 1%-3%)</option>
                <option value="TS_Pay">📲 台新 Pay (指定通路 3.8%)</option>
                <option value="Pi_Pay">📲 Pi 錢包 APP (綁玉山Pi卡 3%)</option>
                <option value="eWallet">📲 玉山 e Wallet (掃碼支付 1.2%)</option>
                <option value="Japan_AP">🇯🇵 日本 Apple Pay 感應 (4%-5%)</option>
                <option value="Gas">⛽ 加油 (實體卡/中油Pay 3.3%)</option>
                <option value="Lunch">🍱 平日午餐 (11-14 超商快點吃 15%)</option>
            </select>
        </div>

        <div class="plan-select cube-border">
            <label style="color:var(--cube-color); font-weight:800;">🌲 國泰 CUBE 當日方案</label>
            <select id="cbPlan">
                <option value="Digital">玩數位 (網購/串流 3%)</option>
                <option value="Travel">趣旅行 (海外/交通 3%)</option>
                <option value="Select">集精選 (中油/超商 2%)</option>
                <option value="Japan">日本賞 (日本實體 3.5%)</option>
            </select>
        </div>

        <div class="plan-select ts-border">
            <label style="color:var(--richart-color); font-weight:800;">🐶 台新 Richart 預設方案</label>
            <select id="tsPlan">
                <option value="Daily">天天刷 (加油/交通/超商 3.3%)</option>
                <option value="Pay">Pay著刷 (LINE Pay/台新Pay 2.3%)</option>
                <option value="Travel">玩旅刷 (海外/航空公司 3.3%)</option>
            </select>
        </div>

        <button onclick="calc()">✨ 計算 2026/05 最強神卡</button>

        <div id="results" style="margin-top:20px;"></div>
    </div>
</div>

<script>
    // 預覽上傳圖片的功能
    function pv(input, imgId) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById(imgId);
                img.src = e.target.result;
                img.style.opacity = 1; // 顯示圖片
                // 隱藏替代文字
                input.previousElementSibling.firstElementChild.style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 核心計算邏輯 (校正至 2026/05)
    function calc() {
        const a = parseFloat(document.getElementById('amt').value);
        const pt = document.getElementById('payTool').value;
        const cp = document.getElementById('cbPlan').value;
        const tp = document.getElementById('tsPlan').value;
        if (!a) return;

        let res = [];
        let f = (pt === "Japan_AP") ? 0.015 : 0; // 海外手續費

        // 1. 國泰 CUBE (2026/05 版)
        let cr = 0.003; let cn = "一般 0.3% (無腦刷會很慘)";
        if (pt === "PXPay") { cr = 0.07; cn = "全支付專屬 (7% 入帳即給全點)"; }
        else if (cp === "Japan" && pt === "Japan_AP") { cr = 0.035; cn = "日本賞 3.5% (無上限)"; }
        else if (cp === "Digital" && (pt === "LP_WD" || pt === "LP_WE")) { cr = 0.03; cn = "玩數位 (3% LINE Pay)"; }
        else if (cp === "Select" && pt === "Gas") { cr = 0.02; cn = "集精選 (中油 2%)"; }
        res.push({ name: "國泰 CUBE 卡", color: "var(--cube-color)", val: Math.round(a*(cr-f)), note: cn });

        // 2. 台新 Richart (2026/05 版)
        let tr = 0.003; let tn = "一般 0.3%";
        if (pt === "TS_Pay") { tr = 0.038; tn = "台新 Pay (母親節 3.8% 無腦刷)"; }
        else if (tp === "Pay" && (pt === "LP_WD" || pt

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 錢包權益儀表板</title>
    <style>
        :root {
            --cube-color: #0087dc; --jiho-color: #4b5563; 
            --linebank-color: #00c300; --unicard-color: #f59e0b;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px 10px; color: #334155; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .tag { background: #cbd5e1; font-size: 0.7rem; padding: 2px 10px; border-radius: 10px; color: #475569; font-weight: bold; }

        /* 卡片展示區 */
        .card-gallery { display: flex; overflow-x: auto; gap: 12px; padding: 10px 0 20px 0; -webkit-overflow-scrolling: touch; }
        .card-preview { flex: 0 0 140px; background: white; border-radius: 15px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; position: relative; cursor: pointer; }
        .card-img-container { width: 100%; height: 80px; border-radius: 10px; margin-bottom: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.1rem; border: 1px solid #eee; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
        .card-img-container img { width: 100%; height: 100%; object-fit: contain; background: transparent; transition: opacity 0.1s; }

        .bg-cube { background-color: var(--cube-color); }
        .bg-jiho { background-color: var(--jiho-color); }
        .bg-linebank { background-color: var(--linebank-color); }
        .bg-uni { background-color: var(--unicard-color); }

        .card-preview .title { font-weight: 800; font-size: 0.8rem; display: block; margin-bottom: 2px; }
        .card-preview .memo { font-size: 0.65rem; color: #94a3b8; display: block; line-height: 1.2; min-height: 30px; }

        /* 計算主體 */
        .main-box { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 16px; box-sizing: border-box; background: #fff; }
        .plan-select { padding: 12px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid #ccc; background: #f8fafc; font-size: 0.85rem; }
        .cube-border { border-left-color: var(--cube-color); }
        .uni-border { border-left-color: var(--unicard-color); }

        button { width: 100%; padding: 16px; background: #0f172a; color: white; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: active 0.1s; }
        button:active { background: #334155; transform: scale(0.98); }

        /* 結果顯示 */
        #results { margin-top: 20px; }
        .result-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 1px solid #f1f5f9; border-radius: 18px; margin-bottom: 10px; background: white; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-item.best { border: 2.5px solid #10b981; background: #f0fdf4; box-shadow: 0 4px 12px rgba(16,185,129,0.08); }
        .card-info h3 { margin: 0; font-size: 0.95rem; }
        .card-info p { margin: 2px 0 0; font-size: 0.7rem; color: #64748b; font-weight: 500; }
        .val { font-size: 1.4rem; font-weight: 800; text-align: right; color: #1e293b; }
        .best .val { color: #059669; }
        .badge { font-size: 0.6rem; padding: 2px 6px; border-radius: 5px; color: white; font-weight: bold; margin-bottom: 4px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="font-size:1.3rem;">2026/06 錢包權益儀表板</h1>
        <span class="tag">最新更新：四大主力剛需極簡版</span>
    </div>

    <div class="card-gallery">
        <div class="card-preview" onclick="document.getElementById('up-uni').click()">
            <div class="card-img-container bg-uni"><span>Unicard</span><img src="" id="img-uni" style="opacity:0;"></div>
            <input type="file" id="up-uni" hidden onchange="pv(this, 'img-uni')">
            <span class="title" style="color:var(--unicard-color)">玉山 Unicard</span>
            <span class="memo">自選特店最高 4.5%<br>LINE Pay/加油/淘寶</span>
        </div>
        <div class="card-preview" onclick="document.getElementById('up-cube').click()">
            <div class="card-img-container bg-cube"><span>CUBE</span><img src="" id="img-cube" style="opacity:0;"></div>
            <input type="file" id="up-cube" hidden onchange="pv(this, 'img-cube')">
            <span class="title" style="color:var(--cube-color)">國泰 CUBE</span>
            <span class="memo">全支付 7%<br>方案 3%</span>
        </div>
        <div class="card-preview" onclick="document.getElementById('up-jiho').click()">
            <div class="card-img-container bg-jiho"><span>吉鶴</span><img src="" id="img-jiho" style="opacity:0;"></div>
            <input type="file" id="up-jiho" hidden onchange="pv(this, 'img-jiho')">
            <span class="title" style="color:var(--jiho-color)">聯邦吉鶴</span>
            <span class="memo">日本 AP 4%<br>國內保底 1%</span>
        </div>
        <div class="card-preview" onclick="document.getElementById('up-lb').click()">
            <div class="card-img-container bg-linebank"><span>LINEBank</span><img src="" id="img-lb" style="opacity:0;"></div>
            <input type="file" id="up-lb" hidden onchange="pv(this, 'img-lb')">
            <span class="title" style="color:var(--linebank-color)">LINE Bank</span>
            <span class="memo">午餐 15%<br>週末 4%</span>
        </div>
    </div>

    <div class="main-box">
        <div class="form-group">
            <label>💰 消費金額 (TWD)</label>
            <input type="number" id="amt" value="1000" inputmode="numeric">
        </div>

        <div class="form-group">
            <label>📍 支付工具 & 場景</label>
            <select id="payTool">
                <option value="LP_MyFav">📲 LINE Pay 支付 (已加 Unicard 任意選 4.0%)</option>
                <option value="Gas_MyFav">⛽ 加油 (中油直營店 - 已加任意選 4.0%)</option>
                <option value="Online_MyFav">📦 蝦皮購物 (已加任意選 4.0%)</option>
                <option value="Taobao_Fav">📦 淘寶網 (跨境網購 - 已加任意選 4.0%)</option>
                <option value="Apple_3C">💻 Apple 官網 / 直營店大額消費 (4.0%)</option>
                <option value="Traffic_MyFav">🚄 台灣高鐵 / 台北捷運 (已加任意選 4.0%)</option>
                <option value="PXPay">📲 全支付 (綁定國泰 CUBE 方案 7%)</option>
                <option value="Japan_AP">🇯🇵 日本 Apple Pay 感應 (吉鶴卡專區 4%)</option>
                <option value="Overseas_Uni">✈️ 越南 / 澳洲實體店刷卡 (Unicard 17國加碼)</option>
                <option value="Lunch_Store">🏪 超商 - 平日午餐 (11-14 快點吃 15%)</option>
                <option value="Cube_Store">🏪 超商 - 其他時段 (CUBE 集精選 2%)</option>
                <option value="General">🏧 其他一般消費 (無加碼通路保底 1%)</option>
            </select>
        </div>

        <div class="plan-select uni-border">
            <label style="color:var(--unicard-color); font-weight:800;">💳 玉山 Unicard 權益設定 (月底大結算)</label>
            <select id="uniPlan">
                <option value="Arbitrary">任意選 (自選名單 4.0% e點)</option>
                <option value="Simple">簡單選 (百大特店通用 3.5% e點)</option>
                <option value="Up">UP選 (大額消費/月底壓線開 4.5% e點)</option>
            </select>
        </div>

        <div class="plan-select cube-border">
            <label style="color:var(--cube-color); font-weight:800;">🌲 國泰 CUBE 當日方案 (當天深夜結算)</label>
            <select id="cbPlan">
                <option value="Digital">玩數位 (網購/串流 3%)</option>
                <option value="Select">集精選 (中油直營/超商 2%)</option>
                <option value="Travel">趣旅行 (海外/航空公司 3%)</option>
                <option value="Japan">日本賞 (日本實體 3.5%)</option>
            </select>
        </div>

        <button onclick="calc()">🚀 計算目前最划算刷卡排行</button>
        <div id="results"></div>
    </div>
</div>

<script>
    function pv(input, imgId) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById(imgId);
                img.src = e.target.result;
                img.style.opacity = 1;
                input.previousElementSibling.firstElementChild.style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function calc() {
        const a = parseFloat(document.getElementById('amt').value);
        const pt = document.getElementById('payTool').value;
        const cp = document.getElementById('cbPlan').value;
        const up = document.getElementById('uniPlan').value;
        if (!a) return;

        let res = [];
        // 判定海外消費手續費 1.5%
        let f = (pt === "Japan_AP" || pt === "Taobao_Fav" || pt === "Apple_3C" || pt === "Overseas_Uni") ? 0.015 : 0;

        // 1. 玉山 Unicard
        let ur = 0.01; let un = "一般消費 1% e點";
        if (pt === "LP_MyFav" || pt === "Gas_MyFav" || pt === "Online_MyFav" || pt === "Apple_3C" || pt === "Traffic_MyFav" || pt === "Taobao_Fav" || pt === "Overseas_Uni") {
            if (up === "Simple") { ur = 0.035; un = "簡單選 (3.5% e點)"; }
            else if (up === "Arbitrary") { ur = 0.04; un = "任意選 (自選名單 4.0% e點)"; }
            else if (up === "Up") { ur = 0.045; un = "UP選模式 (全月回溯最高 4.5% e點)"; }
            if (pt === "Overseas_Uni" && up === "Arbitrary") { un += " (含海外17國實體加碼)"; }
        }
        res.push({ name: "玉山 Unicard", color: "var(--unicard-color)", val: Math.round(a*(ur-f)), note: un });

        // 2. 國泰 CUBE
        let cr = 0.003; let cn = "一般消費 0.3%";
        if (pt === "PXPay") { cr = 0.07; cn = "全支付專屬方案 (7%)"; }
        else if (cp === "Japan" && pt === "Japan_AP") { cr = 0.035; cn = "日本賞 3.5%"; }
        else if (cp === "Digital" && (pt === "LP_MyFav" || pt === "Online_MyFav" || pt === "Taobao_Fav")) { cr = 0.03; cn = "玩數位方案 (3% 當日高手改單)"; }
        else if (cp === "Select" && (pt === "Gas_MyFav" || pt === "Cube_Store")) { cr = 0.02; cn = "集精選 (中油直營/超商 2%)"; }
        else if (cp === "Travel" && pt === "Overseas_Uni") { cr = 0.03; cn = "趣旅行 (海外實體 3% 無上限)"; }
        res.push({ name: "國泰 CUBE 卡", color: "var(--cube-color)", val: Math.round(a*(cr-f)), note: cn });

        // 3. 聯邦吉鶴卡
        let jr = 0.01; let jn = "國內一般 1% 保底";
        if (pt === "Japan_AP") { jr = 0.04; jn = "日本 AP感應 4% (專武封神)"; }
        res.push({ name: "聯邦吉鶴卡", color: "var(--jiho-color)", val: Math.round(a*(jr-f)), note: jn });

        // 4. LINE Bank 快點卡
        let lr = 0.005; let ln = "一般消費 0.5%";
        if (pt === "Lunch_Store") { lr = 0.15; ln = "平日午餐快點吃 (15% 限量專武)"; }
        res.push({ name: "LINE Bank 快點卡", color: "var(--linebank-color)", val: Math.round(a*(lr-f)), note: ln });

        res.sort((a,b) => b.val - a.val);
        const div = document.getElementById('results');
        div.innerHTML = "";
        res.forEach((item, i) => {
            const isBest = i === 0 && item.val > 0;
            div.innerHTML += `<div class="result-item ${isBest ? 'best' : ''}"><div class="card-info"><span class="badge" style="background:${item.color}">${item.name.split(" ")[0]}</span><h3>${item.name}</h3><p>${item.note}</p></div><div class="val">$${item.val}</div></div>`;
        });
    }
</script>
</body>
</html>
